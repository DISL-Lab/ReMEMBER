[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remember"
version = "0.1.0"
description = "Self-contained core of the ReMEMber retrieval method"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
retrieval = ["rank-bm25>=0.2.2", "tiktoken>=0.7"]
inference = ["sentence-transformers>=3", "openai>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
