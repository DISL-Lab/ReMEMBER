[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remember"
version = "0.1.0"
description = "Self-contained core of the ReMEMber retrieval method"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "tiktoken>=0.7", "rank-bm25>=0.2", "numpy>=1.24"]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3"]
inference = ["openai>=1"]
vllm = ["vllm>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
remember = ["configs/*.yaml", "prompts/*.txt"]
